name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # RELEASE.2025-09-07T16-13-09Z, by digest (the multi-architecture index).
  MINIO_IMAGE_DIGEST: sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  MINIO_IMAGE: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  MINIO_LOCAL_TAG: kippu-ci/minio:pinned

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node 24)
    runs-on: ubuntu-latest
    services:
      kippu-store:
        # The Kippu store's own instance and credentials (AD-20, REQ-SDK-9).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kippu_api
          POSTGRES_PASSWORD: kippu_api_ci
          POSTGRES_DB: kippu_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kippu_api -d kippu_api"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KIPPU_DATABASE_URL: postgres://kippu_api:kippu_api_ci@127.0.0.1:5432/kippu_api
      # Placeholder hostnames: the real ones are not chosen yet.
      KIPPU_LOGIN_RP_ID: login.kippu.example
      KIPPU_LOGIN_ORIGINS: https://ibento.login.kippu.example
      KIPPU_HOLDER_RP_ID: holder.kippu.example
      # The development wiring: backend-memory, a software KMS, a development sponsor.
      KIPPU_LEDGER_ENVIRONMENT: development
      KIPPU_TEST_DATABASE_URL: postgres://kippu_api:kippu_api_ci@127.0.0.1:5432/kippu_api
      # Metadata object storage: a MinIO stand-in (F-026). No provider is chosen yet.
      KIPPU_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      KIPPU_TEST_S3_ACCESS_KEY_ID: kippu_metadata
      KIPPU_TEST_S3_SECRET_ACCESS_KEY: kippu_metadata_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # A service container cannot be given MinIO's `server` command, so it is started here.
      # MinIO withdrew its Docker Hub images, so the image comes from quay.io, pinned by
      # digest. It is kept in the Actions cache, and quay.io is reached only on a cache miss,
      # with retries, so a registry outage does not block CI.
      - name: Restore the MinIO image from the cache
        id: minio-image
        uses: actions/cache@v6
        with:
          path: /tmp/minio-image.tar
          key: minio-image-${{ env.MINIO_IMAGE_DIGEST }}
      - name: Pull the MinIO image on a cache miss
        if: steps.minio-image.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$MINIO_IMAGE"; then break; fi
            if [ "$attempt" = 5 ]; then echo "quay.io did not serve $MINIO_IMAGE" >&2; exit 1; fi
            sleep $((attempt * 15))
          done
          # `docker load` does not restore a repository digest, so the cached image is tagged.
          docker tag "$MINIO_IMAGE" "$MINIO_LOCAL_TAG"
          docker save "$MINIO_LOCAL_TAG" -o /tmp/minio-image.tar
      - name: Start the metadata object storage stand-in (MinIO)
        run: |
          if ! docker image inspect "$MINIO_LOCAL_TAG" >/dev/null 2>&1; then
            docker load -i /tmp/minio-image.tar
          fi
          docker run -d --name kippu-metadata-storage -p 9000:9000 \
            -e MINIO_ROOT_USER=kippu_metadata -e MINIO_ROOT_PASSWORD=kippu_metadata_ci \
            "$MINIO_LOCAL_TAG" server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs kippu-metadata-storage
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations run against the Kippu store, and a second run applies nothing
        run: |
          pnpm migrate
          pnpm migrate | grep -Fx "the store is up to date"
      - name: Reviewers are created and disabled from the command line, never over HTTP
        run: |
          pnpm reviewer:create --email ci-reviewer@kippu.example | grep -F "enrolment code:"
          if pnpm reviewer:create --email ci-reviewer@kippu.example; then
            echo "the command line created a second reviewer with the same email" >&2
            exit 1
          fi
          pnpm reviewer:reissue-code --email ci-reviewer@kippu.example | grep -F "enrolment code:"
          pnpm reviewer:disable --email ci-reviewer@kippu.example | grep -F "disabled reviewer"
      - name: No metadata schema declares a personal-data field
        run: pnpm lint:personal-data
      - name: A deny-listed field fails the personal-data lint
        run: |
          if node packages/metadata-schema/dist/src/lint-cli.js packages/metadata-schema/test/fixtures/personal-data.schema.json; then
            echo "the lint accepted a schema with a deny-listed field" >&2
            exit 1
          fi
      - name: Schemas are published and fetched cross-origin, with no credentials, from the built edge
        env:
          KIPPU_METADATA_S3_BUCKET: kippu-metadata
          KIPPU_METADATA_S3_ENDPOINT: http://127.0.0.1:9000
          KIPPU_METADATA_S3_FORCE_PATH_STYLE: "true"
          KIPPU_METADATA_S3_ACCESS_KEY_ID: kippu_metadata
          KIPPU_METADATA_S3_SECRET_ACCESS_KEY: kippu_metadata_ci
          KIPPU_METADATA_EDGE_PORT: "8081"
        run: |
          docker exec kippu-metadata-storage sh -c \
            'mc alias set local http://127.0.0.1:9000 kippu_metadata kippu_metadata_ci && mc mb local/kippu-metadata'
          pnpm metadata:publish-schemas
          pnpm metadata:check-self-contained
          pnpm metadata:edge &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -D headers.txt -o event.json -H "Origin: https://any-ticketto-client.example" \
            http://127.0.0.1:8081/v0/schemas/event/1.0.json
          cat headers.txt
          grep -iFx "access-control-allow-origin: *" <(tr -d '\r' < headers.txt)
          if grep -iq "access-control-allow-credentials" headers.txt; then exit 1; fi
          cmp event.json packages/metadata-schema/schemas/event/1.0.json
      - name: The sponsor relay starts and serves with kippu-api stopped, on read-only credentials, to a client with no tRPC dependency
        env:
          KIPPU_DATABASE_URL: ""
        run: |
          psql "postgres://kippu_api:kippu_api_ci@127.0.0.1:5432/kippu_api" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE kippu_sponsor_relay LOGIN PASSWORD 'kippu_sponsor_relay_ci' IN ROLE kippu_sponsor_relay_reader"
          if curl -fsS http://127.0.0.1:8080/health; then echo "kippu-api must not be running" >&2; exit 1; fi
          KIPPU_SPONSOR_ENVIRONMENT=test \
          KIPPU_SPONSOR_DERIVED_DATABASE_URL=postgres://kippu_sponsor_relay:kippu_sponsor_relay_ci@127.0.0.1:5432/kippu_api \
          KIPPU_SPONSOR_SOFTWARE_SECRET_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
          KIPPU_SPONSOR_PORT=8082 \
          KIPPU_SPONSOR_REGISTRATIONS_PER_WINDOW=5 KIPPU_SPONSOR_REGISTRATION_WINDOW_SECONDS=3600 \
          KIPPU_SPONSOR_LAG_WAIT_MS=5000 \
          KIPPU_SPONSOR_HOLDER_RP_ID=holder.kippu.example \
            node dist/sponsor/server.js &
          relay=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8082/health; then
              # T-023-05: a client with no tRPC dependency obtains a sponsorship.
              scripts/check-sponsor-client.sh http://127.0.0.1:8082
              kill "$relay"
              exit 0
            fi
            sleep 1
          done
          echo "the sponsor relay did not answer" >&2
          exit 1
      - name: The built server refuses the production ledger environment
        run: |
          if KIPPU_LEDGER_ENVIRONMENT=production PORT=8080 node dist/server.js; then
            echo "the server started with KIPPU_LEDGER_ENVIRONMENT=production" >&2
            exit 1
          fi
      - name: Health endpoint answers from the built server
        run: |
          PORT=8080 node dist/server.js &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          echo "health endpoint did not answer" >&2
          exit 1

  contract:
    name: Contracts — a client installs the packed @kippurocks/api and @kippurocks/metadata-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contract

  vendor:
    name: Vendored libticketto reproduces from its pinned commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm vendor:check

  image:
    name: Container image (built, never pushed)
    runs-on: ubuntu-latest
    services:
      kippu-store:
        # The Kippu store's own instance and credentials (AD-20, REQ-SDK-9).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kippu_api
          POSTGRES_PASSWORD: kippu_api_ci
          POSTGRES_DB: kippu_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kippu_api -d kippu_api"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KIPPU_DATABASE_URL: postgres://kippu_api:kippu_api_ci@127.0.0.1:5432/kippu_api
      # Placeholder hostnames: the real ones are not chosen yet.
      KIPPU_LOGIN_RP_ID: login.kippu.example
      KIPPU_LOGIN_ORIGINS: https://ibento.login.kippu.example
      KIPPU_HOLDER_RP_ID: holder.kippu.example
      # The development wiring: backend-memory, a software KMS, a development sponsor.
      KIPPU_LEDGER_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kippu-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Health endpoint answers from the container
        run: |
          docker run --rm --network host -e KIPPU_DATABASE_URL kippu-api:ci node dist/store/migrate-cli.js
          docker run -d --name kippu-api --network host \
            -e KIPPU_DATABASE_URL -e KIPPU_LOGIN_RP_ID -e KIPPU_LOGIN_ORIGINS -e KIPPU_HOLDER_RP_ID \
            -e KIPPU_LEDGER_ENVIRONMENT \
            kippu-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              # The domain services answer too: a call through tRPC reaches the store.
              curl -fsS -X POST -H 'content-type: application/json' \
                -d '{"email":"ci@organiser.example"}' \
                http://127.0.0.1:8080/v0/trpc/auth.organiser.beginSignUp | grep -F '"ceremonyId"' \
                && exit 0
              docker logs kippu-api
              exit 1
            fi
            sleep 1
          done
          docker logs kippu-api
          echo "health endpoint did not answer" >&2
          exit 1
