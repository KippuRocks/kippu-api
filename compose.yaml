# Local stand-in for the Kippu store: PostgreSQL in Docker (AD-20).
#
# This is kippu-api's own instance, with its own credentials. The ledger
# service (ticketto-offchain) runs a separate instance that kippu-api has no
# route to (REQ-SDK-9). A managed database is not chosen yet; production
# supplies KIPPU_DATABASE_URL and nothing else changes.
name: kippu-api

services:
  kippu-store:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kippu_api
      POSTGRES_PASSWORD: kippu_api_local
      POSTGRES_DB: kippu_api
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kippu_api -d kippu_api"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - kippu-store:/var/lib/postgresql

  # Local stand-in for metadata object storage: MinIO, S3-compatible (F-026).
  # No object store or CDN is chosen yet; a provider is configured through the
  # same KIPPU_METADATA_S3_* keys. The bucket stays private: documents are read
  # through the public path (`pnpm metadata:edge`), never from the bucket.
  kippu-metadata-storage:
    # MinIO withdrew its Docker Hub images: quay.io, RELEASE.2025-09-07T16-13-09Z, by digest.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: kippu_metadata
      MINIO_ROOT_PASSWORD: kippu_metadata_local
    ports:
      - "127.0.0.1:59000:9000"
    # Healthy once the metadata bucket exists: the check creates it if missing.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc alias set local http://127.0.0.1:9000 kippu_metadata kippu_metadata_local >/dev/null
          && mc mb --ignore-existing local/kippu-metadata >/dev/null
          && mc mb --ignore-existing local/kippu-proofs >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - kippu-metadata-storage:/data

volumes:
  kippu-store:
  kippu-metadata-storage:
