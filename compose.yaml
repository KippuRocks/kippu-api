# Local stand-in for the Kippu store: PostgreSQL in Docker (AD-20).
#
# This is kippu-api's own instance, with its own credentials. The ledger
# service (ticketto-offchain) runs a separate instance that kippu-api has no
# route to (REQ-SDK-9). A managed database is not chosen yet; production
# supplies KIPPU_DATABASE_URL and nothing else changes.
name: kippu-api

services:
  kippu-store:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kippu_api
      POSTGRES_PASSWORD: kippu_api_local
      POSTGRES_DB: kippu_api
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kippu_api -d kippu_api"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - kippu-store:/var/lib/postgresql

  # Local stand-in for metadata object storage: SeaweedFS's S3 gateway (F-026).
  # No object store or CDN is chosen yet; a provider is configured through the
  # same KIPPU_METADATA_S3_* keys. The bucket stays private: documents are read
  # through the public path (`pnpm metadata:edge`), never from the bucket.
  kippu-metadata-storage:
    # MinIO withdrew its images: SeaweedFS 4.51 from Docker Hub, by digest.
    image: chrislusf/seaweedfs@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-master.volumeSizeLimitMB=64", "-volume.max=32"]
    environment:
      AWS_ACCESS_KEY_ID: kippu_metadata
      AWS_SECRET_ACCESS_KEY: kippu_metadata_local
    ports:
      - "127.0.0.1:59000:9000"
    # Healthy once the metadata buckets exist: the check creates them if missing.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for b in kippu-metadata kippu-proofs; do
          echo "s3.bucket.list" | weed shell -master=127.0.0.1:9333 2>/dev/null | grep -qx "  $$b" ||
          echo "s3.bucket.create -name $$b" | weed shell -master=127.0.0.1:9333 >/dev/null 2>&1;
          done;
          echo "s3.bucket.list" | weed shell -master=127.0.0.1:9333 2>/dev/null | grep -q kippu-proofs
      interval: 2s
      timeout: 10s
      retries: 30
    volumes:
      - kippu-metadata-storage:/data

volumes:
  kippu-store:
  kippu-metadata-storage:
